name: checks

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 对齐生产镜像 python:3.12-slim
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium   # e2e/UI 测试需浏览器
      - run: pytest -q

  docker-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 构建镜像
        run: docker build -t reflow:ci .
      - name: 起容器并检查健康检查与登录闸门
        run: |
          docker run -d --name reflow-ci -p 8000:8000 reflow:ci
          for i in $(seq 1 30); do
            health=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz || true)
            home=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            if [ "$health" = "200" ] && [ "$home" = "303" ]; then
              echo "healthz 200，未登录首页 303 到登录，构建冒烟通过"
              docker rm -f reflow-ci
              exit 0
            fi
            sleep 1
          done
          echo "容器 30 秒内未就绪"; docker logs reflow-ci; docker rm -f reflow-ci; exit 1
