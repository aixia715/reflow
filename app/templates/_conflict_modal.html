<div class="modal-overlay">
  <div class="modal">
    <div class="modal-head">下游节点改过同一位号，请确认</div>
    {# 这次修正还没落库。取消等于什么都不做；「保留下游值」要点确认才生效。
       「确认」是整页 POST，一按就跳走：附件面板里若还有已选未上传的文件会被
       悄悄丢掉，先问一句（函数在 node_detail.html，本弹窗只由该页弹出）。 #}
    {% if fix_note %}
    <div class="flash flash-info">{{ fix_note }}</div>
    {% endif %}
    <form method="post" action="/board/{{ board_id }}/node/{{ node_id }}/resolve"
          onsubmit="return confirmPendingAttachments()">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="revision" value="{{ edit_revision }}">
      <input type="hidden" name="edit_reference" value="{{ edit_reference }}">
      <input type="hidden" name="op" value="{{ edit_op }}">
      <input type="hidden" name="part" value="{{ edit_part }}">
      {% for c in conflicts %}
      <fieldset class="conflict">
        <legend><code>{{ c.reference }}</code> 在下游节点 #{{ c.downstream_node_id }} 被显式修改过</legend>
        <input type="hidden" name="downstream_node_id" value="{{ c.downstream_node_id }}">
        <input type="hidden" name="downstream_revision" value="{{ c.downstream_revision }}">
        <input type="hidden" name="reference" value="{{ c.reference }}">
        <label><input type="radio" name="choice" value="keep" checked>
          保留下游值（{{ c.downstream_value or '不贴' }}），下游不变</label>
        <label><input type="radio" name="choice" value="take">
          采用修正值（{{ c.corrected_value or '不贴' }}）并向后传播</label>
      </fieldset>
      {% endfor %}
      <div class="modal-foot">
        <button type="button" class="btn"
                onclick="document.getElementById('modal').innerHTML=''">取消</button>
        <button class="btn btn-primary">确认</button>
      </div>
    </form>
  </div>
</div>
