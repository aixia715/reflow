<div class="modal-overlay">
  <div class="modal">
    <div class="modal-head">下游节点改过同一位号，请确认</div>
    <p class="muted">节点还没插入。取消等于什么都不做；选完再确认才会写入。</p>
    <form id="insert-confirm-form"
          hx-post="/board/{{ board_id }}/node/{{ parent_id }}/insert" hx-swap="none"
          onsubmit="window.insertBypassUnload = true">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="revision" value="{{ revision }}">
      <input type="hidden" name="committed_at" value="{{ committed_at }}">
      <input type="hidden" name="message" value="{{ message }}">
      <input type="hidden" name="description" value="{{ description }}">
      <input type="hidden" name="changes" value="{{ changes }}">
      {% for c in conflicts %}
      <fieldset class="conflict">
        <legend><code>{{ c.reference }}</code> 在下游节点 #{{ c.downstream_node_id }} 被显式修改过</legend>
        <input type="hidden" name="downstream_node_id" value="{{ c.downstream_node_id }}">
        <input type="hidden" name="downstream_revision" value="{{ c.downstream_revision }}">
        <input type="hidden" name="reference" value="{{ c.reference }}">
        <select class="input" name="choice">
          <option value="keep">保留下游值（{{ c.downstream_value or '不贴' }}），下游不变</option>
          <option value="take">采用修正值（{{ c.corrected_value or '不贴' }}）并向后传播</option>
        </select>
      </fieldset>
      {% endfor %}
      <div class="modal-foot">
        <button type="button" class="btn"
                onclick="document.getElementById('modal').innerHTML=''">取消</button>
        <button class="btn btn-primary">确认插入</button>
      </div>
    </form>
  </div>
</div>
