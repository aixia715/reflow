<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 — Reflow</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.setAttribute('data-theme',
    localStorage.getItem('theme') || 'light');</script>
</head>
<body class="login-screen">
  <main class="panel login-card">
    <p class="login-brand">⟲ Reflow</p>
    <h1>登录</h1>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    {% if needs_admin %}
    <div class="empty">
      <p>还没有可以登录的账号。</p>
      <p>请在服务器上执行 <code>python -m app.cli create-admin</code> 创建第一个管理员。此页面不能注册，也不能设置密码。</p>
    </div>
    {% else %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>用户名
        <input class="input" name="username" value="{{ username }}" autocomplete="username" required autofocus>
      </label>
      <label>密码
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">登录</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
