{% extends "base.html" %}
{% block title %}修改密码 — Reflow{% endblock %}
{% block crumbs %}<a href="/">首页</a> / 修改密码{% endblock %}
{% block content %}
<div class="page-head"><h1>修改密码</h1></div>
<p class="muted">更新后当前登录保持有效，其他会话会失效。</p>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form class="panel form-stack" method="post" action="/account/password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>当前密码
    <input class="input" type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label>新密码
    <input class="input" type="password" name="new_password" autocomplete="new-password" required>
  </label>
  <label>再输入一次新密码
    <input class="input" type="password" name="new_password2" autocomplete="new-password" required>
  </label>
  <button class="btn btn-primary" type="submit">更新密码</button>
</form>
{% endblock %}
