<div class="modal-overlay">
  <div class="modal">
    <div class="modal-head">将影响以下 {{ boards|length }} 块板</div>
    <ul>
      {% for b in boards %}
      <li>板 {{ b.board_uid }} · PCB {{ b.pcb_version }} · BOM {{ b.bom_version }}</li>
      {% endfor %}
    </ul>
    <form {% if method == 'delete' %}hx-delete="{{ action }}"{% else %}hx-post="{{ action }}"{% endif %}
          hx-swap="none">
      {% for key, value in fields %}
      <input type="hidden" name="{{ key }}" value="{{ value }}">
      {% endfor %}
      {% if kind == 'delete' %}
      <label>键入「{{ confirm_label }}」以确认删除
        <input class="input" name="confirm_name" autocomplete="off" required>
      </label>
      <p class="muted">名称一致才会删除。取消则什么都不改。</p>
      <div class="modal-foot">
        <button type="button" class="btn"
                onclick="document.getElementById('modal').innerHTML=''">取消</button>
        <button class="btn btn-outline danger" type="submit">确认删除</button>
      </div>
      {% else %}
      <p class="muted">看过上面的清单再确认。取消则什么都不改。</p>
      <div class="modal-foot">
        <button type="button" class="btn"
                onclick="document.getElementById('modal').innerHTML=''">取消</button>
        <button class="btn btn-primary" type="submit">确认重命名</button>
      </div>
      {% endif %}
    </form>
  </div>
</div>
